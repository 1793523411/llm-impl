<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">llm-impl debugger flow</title>
  <desc id="desc">A three-column debugger layout showing cases, model input preview, editable messages, and streaming send path.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .soft { fill: #eef6ff; stroke: #93c5fd; }
      .purple { fill: #faf5ff; stroke: #c084fc; }
      .green { fill: #f0fdf4; stroke: #86efac; }
      .orange { fill: #fff7ed; stroke: #fdba74; }
      .text { font: 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font-size: 12px; fill: #475569; }
      .tiny { font-size: 10px; fill: #64748b; letter-spacing: .06em; }
      .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .btn { fill: #e2e8f0; stroke: #94a3b8; }
      .arrow { stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="430" rx="18"/>

  <rect class="panel" x="28" y="30" width="180" height="370" rx="10"/>
  <text class="tiny" x="48" y="58">CASES</text>
  <rect class="btn" x="48" y="78" width="58" height="26" rx="5"/>
  <text class="small" x="60" y="96">+ Case</text>
  <rect class="btn" x="114" y="78" width="52" height="26" rx="5"/>
  <text class="small" x="128" y="96">+ Dir</text>
  <text class="small" x="48" y="135">coverage</text>
  <text class="small" x="66" y="162">01-simple-chat</text>
  <text class="small" x="66" y="188">02-calculator</text>
  <rect class="green" x="56" y="205" width="128" height="26" rx="5"/>
  <text class="small" x="66" y="223">11-pure-mock-tool</text>

  <rect class="panel" x="236" y="30" width="295" height="370" rx="10"/>
  <text class="tiny" x="256" y="58">MODEL INPUT</text>
  <text class="small" x="396" y="58">anthropic-messages · exact request body</text>
  <rect class="btn" x="348" y="76" width="86" height="28" rx="5"/>
  <text class="small" x="362" y="95">Copy Stream</text>
  <rect class="btn" x="444" y="76" width="66" height="28" rx="5"/>
  <text class="small" x="455" y="95">Non-stream</text>
  <rect class="panel" x="256" y="122" width="255" height="168" rx="6"/>
  <text class="mono" x="272" y="150">{</text>
  <text class="mono" x="288" y="172">"model": "claude-sonnet-4-6",</text>
  <text class="mono" x="288" y="194">"stream": true,</text>
  <text class="mono" x="288" y="216">"messages": [ ... ],</text>
  <text class="mono" x="288" y="238">"tools": [ ... ]</text>
  <text class="mono" x="272" y="260">}</text>
  <text class="tiny" x="256" y="326">SYSTEM PROMPT</text>
  <rect class="panel" x="256" y="342" width="255" height="36" rx="6"/>
  <text class="small" x="272" y="365">editable prompt sent with every run</text>

  <rect class="panel" x="560" y="30" width="392" height="370" rx="10"/>
  <text class="tiny" x="580" y="58">EDITABLE CONVERSATION</text>
  <rect class="soft" x="580" y="78" width="330" height="74" rx="8"/>
  <text class="tiny" x="596" y="102">USER · TEXT</text>
  <text class="small" x="596" y="126">Ask the model to use mocked inventory data</text>
  <rect class="purple" x="580" y="166" width="330" height="92" rx="8"/>
  <text class="tiny" x="596" y="190">ASSISTANT · TOOL_USE</text>
  <text class="mono" x="596" y="215">mock_inventory_lookup({ sku, qty })</text>
  <text class="small" x="596" y="240">Edit tool name, id, and input JSON inline</text>
  <rect class="orange" x="580" y="272" width="330" height="78" rx="8"/>
  <text class="tiny" x="596" y="296">USER · TOOL_RESULT</text>
  <text class="mono" x="596" y="321">{"available":12,"requested":8}</text>
  <rect class="green" x="580" y="365" width="88" height="28" rx="6"/>
  <text class="small" x="604" y="384">Send ▶</text>
  <rect class="btn" x="680" y="365" width="112" height="28" rx="6"/>
  <text class="small" x="697" y="384">Compare Case</text>

  <path class="arrow" d="M670 379 C505 408 342 407 302 292"/>
  <text class="small" x="340" y="405">Send / Compare use streaming replay of the edited history</text>
</svg>
