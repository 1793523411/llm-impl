<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Copy cURL request generation</title>
  <desc id="desc">A flow diagram for stream and non-stream cURL generation across providers.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .blue { fill: #eff6ff; stroke: #93c5fd; }
      .green { fill: #f0fdf4; stroke: #86efac; }
      .amber { fill: #fffbeb; stroke: #fcd34d; }
      .rose { fill: #fff1f2; stroke: #fda4af; }
      .text { font: 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font-size: 12px; fill: #475569; }
      .tiny { font-size: 10px; fill: #64748b; letter-spacing: .06em; }
      .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>
  <rect class="bg" width="980" height="360" rx="18"/>

  <rect class="blue" x="38" y="46" width="190" height="92" rx="10"/>
  <text class="tiny" x="58" y="72">UI ACTION</text>
  <text class="text" x="58" y="100">Copy Stream</text>
  <text class="small" x="58" y="122">Matches Send / Compare replay</text>

  <rect class="blue" x="38" y="194" width="190" height="92" rx="10"/>
  <text class="tiny" x="58" y="220">UI ACTION</text>
  <text class="text" x="58" y="248">Copy Non-stream</text>
  <text class="small" x="58" y="270">One-shot JSON response</text>

  <rect class="box" x="286" y="58" width="210" height="216" rx="10"/>
  <text class="tiny" x="306" y="84">LOCAL SERVER</text>
  <text class="text" x="306" y="112">POST /api/curl</text>
  <text class="small" x="306" y="140">Reads provider apiKey locally</text>
  <text class="small" x="306" y="166">Chooses endpoint + headers</text>
  <text class="small" x="306" y="192">Trims trailing assistant turns</text>
  <text class="small" x="306" y="218">Adds DeepSeek thinking override</text>
  <text class="small" x="306" y="244">Applies stream mode explicitly</text>

  <rect class="green" x="554" y="34" width="180" height="92" rx="10"/>
  <text class="tiny" x="574" y="60">ANTHROPIC</text>
  <text class="mono" x="574" y="88">/v1/messages</text>
  <text class="small" x="574" y="110">x-api-key + version</text>

  <rect class="amber" x="554" y="144" width="180" height="92" rx="10"/>
  <text class="tiny" x="574" y="170">OPENAI CHAT</text>
  <text class="mono" x="574" y="198">/chat/completions</text>
  <text class="small" x="574" y="220">Authorization Bearer</text>

  <rect class="rose" x="554" y="254" width="180" height="72" rx="10"/>
  <text class="tiny" x="574" y="280">RESPONSES</text>
  <text class="mono" x="574" y="306">/responses</text>

  <rect class="box" x="790" y="82" width="150" height="196" rx="10"/>
  <text class="tiny" x="810" y="108">OUTPUT</text>
  <text class="mono" x="810" y="136">curl 'https://...'</text>
  <text class="mono" x="810" y="162">  -H '...key...'</text>
  <text class="mono" x="810" y="188">  --data-binary</text>
  <text class="mono" x="810" y="214">  &lt;&lt;'JSON'</text>
  <text class="small" x="810" y="246">Ready to paste into a shell</text>

  <path class="arrow" d="M228 92 H286"/>
  <path class="arrow" d="M228 240 H286"/>
  <path class="arrow" d="M496 130 C522 80 532 80 554 80"/>
  <path class="arrow" d="M496 166 H554"/>
  <path class="arrow" d="M496 208 C522 290 532 290 554 290"/>
  <path class="arrow" d="M734 80 C764 96 770 120 790 144"/>
  <path class="arrow" d="M734 190 H790"/>
  <path class="arrow" d="M734 290 C764 270 770 246 790 224"/>
</svg>
